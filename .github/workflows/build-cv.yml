name: Build CV PDF

on:
  push:
    paths:
      - 'cv/**'
      - 'cover-letters/**'
      - 'fonts/**'
      - 'img/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (xelatex)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            cv/2cv.tex
            cover-letters/cover_ku.tex
            cover-letters/cover_letter_audi.tex
            cover-letters/cover_letter_microsoft.tex
            cover-letters/template.tex
          latexmk_use_xelatex: true
          continue_on_error: false
        env:
          TEXINPUTS: ".:./cv//:./cover-letters/moderncv//:"

      - name: Upload CV PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: 2cv.pdf
          retention-days: 90

      - name: Upload cover letter PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: cover-letters-pdf
          path: |
            cover_ku.pdf
            cover_letter_audi.pdf
            cover_letter_microsoft.pdf
            template.pdf
          retention-days: 90
