name: Build CV PDF

on:
  push:
    paths:
      - 'cv/**'
      - 'cover-letters/**'
      - 'project-reference/**'
      - 'fonts/**'
      - 'img/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (xelatex)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            cv/cv_zuleger.tex
            cover-letters/template.tex
            project-reference/projects.tex
          latexmk_use_xelatex: true
          continue_on_error: false
        env:
          TEXINPUTS: ".:./cv//:./cover-letters/moderncv//:./project-reference//:"

      - name: Upload CV PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv_zuleger.pdf
          retention-days: 90

      - name: Upload cover letter template PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cover-letter-template-pdf
          path: template.pdf
          retention-days: 90

      - name: Upload project reference PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-reference-pdf
          path: projects.pdf
          retention-days: 90

      - name: Publish CV PDF under a stable "latest" release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest CV build"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          artifacts: "cv_zuleger.pdf"
          body: |
            Automatically built from the latest commit on `master`.

            Stable download link (never changes):
            https://github.com/${{ github.repository }}/releases/latest/download/cv_zuleger.pdf

      - name: Prepare GitHub Pages site
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p site
          cp cv_zuleger.pdf site/cv_zuleger.pdf
          cp projects.pdf site/projects_zuleger.pdf
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Maximilian Zuleger</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: #f4f4f4;
                color: #4D4D4D;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
              }
              .card {
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.08);
                padding: 2.5rem 3rem;
                max-width: 420px;
                width: 90%;
              }
              h1 {
                color: #0395DE;
                font-size: 1.5rem;
                margin-top: 0;
              }
              a.doc-link {
                display: block;
                padding: 0.9rem 1.2rem;
                margin: 0.75rem 0;
                background: #0395DE;
                color: #fff;
                text-decoration: none;
                border-radius: 8px;
                font-weight: 600;
                transition: background 0.15s ease-in-out;
              }
              a.doc-link:hover {
                background: #0277b3;
              }
              .subtitle {
                color: #999;
                margin-bottom: 1.5rem;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Maximilian Zuleger</h1>
              <p class="subtitle">Tech Lead &amp; Full Stack Software Engineer</p>
              <a class="doc-link" href="cv_zuleger.pdf">📄 View CV</a>
              <a class="doc-link" href="projects_zuleger.pdf">🗂️ View Project References</a>
            </div>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
