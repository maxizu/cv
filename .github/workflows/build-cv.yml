name: Build CV PDF

on:
  push:
    paths:
      - 'cv/**'
      - 'cover-letters/**'
      - 'fonts/**'
      - 'img/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (xelatex)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            cv/cv_zuleger.tex
            cover-letters/template.tex
          latexmk_use_xelatex: true
          continue_on_error: false
        env:
          TEXINPUTS: ".:./cv//:./cover-letters/moderncv//:"

      - name: Upload CV PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv_zuleger.pdf
          retention-days: 90

      - name: Upload cover letter template PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cover-letter-template-pdf
          path: template.pdf
          retention-days: 90

      - name: Publish CV PDF under a stable "latest" release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest CV build"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          artifacts: "cv_zuleger.pdf"
          body: |
            Automatically built from the latest commit on `master`.

            Stable download link (never changes):
            https://github.com/${{ github.repository }}/releases/latest/download/cv_zuleger.pdf

      - name: Prepare GitHub Pages site
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p site
          cp cv_zuleger.pdf site/cv_zuleger.pdf

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
